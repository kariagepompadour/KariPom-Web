function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function colorMix(a,b,t){
  function q(s){let n=parseInt(s.slice(1),16);return [n>>16,(n>>8)&255,n&255]}
  const A=q(a),B=q(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
}
function parseColor(c){
  if(c.startsWith("#")){
    const n=parseInt(c.slice(1),16); return [n>>16,(n>>8)&255,n&255];
  }
  const m=c.match(/rgb\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/i);
  return m ? [Number(m[1]),Number(m[2]),Number(m[3])] : [0,0,0];
}
function mixAny(a,b,t){
  const A=parseColor(a),B=parseColor(b);
  return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
}
function tint(c,pct){return mixAny(c,"#ffffff",clamp(pct/100,0,1))}
function spectrum(p){
  p=clamp(p,0,1)*7; const i=Math.floor(p),j=Math.min(7,i+1),t=p-i;
  return mixAny(EQ_COL[i],EQ_COL[j],t);
}

function clear(c="#fff"){ctx.fillStyle=c;ctx.fillRect(0,0,cv.width,cv.height)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x*S,y*S,w*S,h*S)}
function line(x0,y0,x1,y1,w,c="#000",alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=c;ctx.lineWidth=w*S;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x0*S,y0*S);ctx.lineTo(x1*S,y1*S);ctx.stroke();ctx.restore();
}
function circle(x,y,r,c,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x*S,y*S,r*S,0,Math.PI*2);ctx.fill();ctx.restore();
}
function ellipse(x,y,rx,ry,c,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x*S,y*S,rx*S,ry*S,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function poly(points,c,alpha=1,stroke=null,sw=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(points[0][0]*S,points[0][1]*S);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0]*S,points[i][1]*S);ctx.closePath();
  if(c){ctx.fillStyle=c;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw*S;ctx.stroke()}ctx.restore();
}
function txt(t,x,y,size,c="#000",align="left",bold=false){

function rotatedRect(cx,cy,w,h,a,c){
  ctx.save();ctx.translate(cx*S,cy*S);ctx.rotate(a);ctx.fillStyle=c;ctx.fillRect(-w*S/2,-h*S/2,w*S,h*S);ctx.restore();

function eyelashes(){
  const lashLen=9, lashThick=4, eyeRadius=20, cy=90;
  for(const deg of [25,45,65]){
    const rad=deg*Math.PI/180, dx=Math.cos(rad), dy=Math.sin(rad);
    const lRoot=[90-eyeRadius*dx, cy-eyeRadius*dy];
    const lTip =[90-(eyeRadius+lashLen)*dx, cy-(eyeRadius+lashLen)*dy];
    const rRoot=[230+eyeRadius*dx, cy-eyeRadius*dy];
    const rTip =[230+(eyeRadius+lashLen)*dx, cy-(eyeRadius+lashLen)*dy];
    line(lRoot[0],lRoot[1],lTip[0],lTip[1],lashThick,"#000");
    line(rRoot[0],rRoot[1],rTip[0],rTip[1],lashThick,"#000");
  }
}

function updateEyeSlotReels(now){
  // State-machine update only (reel position/state advance). Called exactly once per
  // frame from drawLighting(); drawFace()'s extra Eye Slot redraw (in front of the
  // Visualizer layer) must call drawEyeSlotReels() only, never this, or the reels
  // would advance twice per frame.
  const ACC=0,SPIN=1,DECL=2,GAP=3,DECR=4,RESULT=5,MAX=.55,stripL=[0,1,2,3,4,5,6,7],stripR=[2,5,7,1,4,0,6,3];
  if(!eslot.stateAt){eslot.state=ACC;eslot.stateAt=now;eslot.stateDur=rnd(500,800)}
  const st=eslot.state;
  if(st===ACC){let p=clamp((now-eslot.stateAt)/eslot.stateDur,0,1),sp=MAX*p;eslot.pos[0]+=sp;eslot.pos[1]+=sp;if(p>=1){eslot.state=SPIN;eslot.stateAt=now;eslot.stateDur=rnd(900,1800)}}
  else if(st===SPIN){eslot.pos[0]+=MAX;eslot.pos[1]+=MAX;if(now-eslot.stateAt>=eslot.stateDur){eslot.decelFrom[0]=eslot.pos[0];eslot.decelAt[0]=now;eslot.decelDur[0]=rnd(650,900);eslot.decelTo[0]=Math.ceil(eslot.pos[0])+2+randInt(3);eslot.state=DECL}}
  else if(st===DECL){eslot.pos[1]+=MAX;let p=clamp((now-eslot.decelAt[0])/eslot.decelDur[0],0,1),e=1-(1-p)**3;eslot.pos[0]=lerp(eslot.decelFrom[0],eslot.decelTo[0],e);if(p>=1){eslot.pos[0]=eslot.decelTo[0];eslot.state=GAP;eslot.stateAt=now;eslot.stateDur=rnd(350,600)}}
  else if(st===GAP){eslot.pos[1]+=MAX;if(now-eslot.stateAt>=eslot.stateDur){eslot.decelFrom[1]=eslot.pos[1];eslot.decelAt[1]=now;eslot.decelDur[1]=rnd(650,900);eslot.decelTo[1]=Math.ceil(eslot.pos[1])+2+randInt(3);eslot.state=DECR}}
  else if(st===DECR){let p=clamp((now-eslot.decelAt[1])/eslot.decelDur[1],0,1),e=1-(1-p)**3;eslot.pos[1]=lerp(eslot.decelFrom[1],eslot.decelTo[1],e);if(p>=1){eslot.pos[1]=eslot.decelTo[1];let l=stripL[Math.round(eslot.pos[0])%8],r=stripR[Math.round(eslot.pos[1])%8];eslot.match=l===r;eslot.resultAt=now;eslot.state=RESULT;eslot.stateAt=now;eslot.stateDur=rnd(1600,2500)}}
  else if(st===RESULT && now-eslot.stateAt>=eslot.stateDur){eslot.state=ACC;eslot.stateAt=now;eslot.stateDur=rnd(500,800)}
}
function drawEyeSlotReels(now){
  // Render only (no state mutation) — safe to call more than once per frame.
  const RESULT=5,stripL=[0,1,2,3,4,5,6,7],stripR=[2,5,7,1,4,0,6,3];
  function sym(sym,cx,cy){const R=17;
    if(sym===0)txt("7",cx,cy+8,22,"#ff0000","center",true);
    else if(sym===1){rect(cx-R,cy-R+4,R*2,R*2-8,"#000");txt("BAR",cx,cy+4,11,"#fff","center",true)}
    else if(sym===2){rect(cx-2,cy-R,4,R,"#28963c");circle(cx-R/2,cy+R/3,R/2,"#ff0000");circle(cx+R/2,cy+R/3,R/2,"#ff0000")}
    else if(sym===3)circle(cx,cy,R-1,"#1e3c96");
    else if(sym===4)txt("¥",cx,cy+7,21,"#ffd228","center",true);
    else if(sym===5)txt("$",cx,cy+7,21,"#3cbe50","center",true);
    else if(sym===6)txt("♥",cx,cy+7,22,"#ff0000","center",true);
    else{circle(cx,cy,R-1,"#469632");circle(cx,cy,R-5,"#bee18c");for(let i=0;i<8;i++){let a=i*Math.PI/4;rect(cx+Math.cos(a)*(R-8)-1,cy+Math.sin(a)*(R-8)-1,2,2,"#000")}}
  }
  function reel(pos,cx,strip){
    const winX=cx-20,winY=50;
    rect(winX,winY,40,80,"#fff");
    ctx.save();ctx.beginPath();ctx.rect(winX*S,winY*S,40*S,80*S);ctx.clip();
    const k0=Math.floor(pos);for(let k=k0-1;k<=k0+1;k++){const py=90+Math.round((pos-k)*40),s=strip[((k%8)+8)%8];sym(s,cx,py)}ctx.restore();

  poly([[0,hl],[320,hr],[320,240],[0,240]],"#14557d");poly([[0,hl],[320,hr],[320,gr2],[0,gl2]],"#3787a0");
  for(let i=0;i<14;i++){let a=skbStreakA[i]+bank,cx=Math.cos(a),cy=Math.sin(a)*.62,r0=skbStreakR[i],r1=r0+22,x0=160+cx*r0,y0=clamp(132+cy*r0,TOP,240),x1=160+cx*r1,y1=clamp(132+cy*r1,TOP,240),b=Math.min(1,(60+195*r0/190)/255);line(x0,y0,x1,y1,1,"#fff",b)}

  if(skb.state===1||skb.state===2||skb.state===3){
    const x=skb.enemyX,y=skb.enemyY,s=skb.enemyScale||.6,a=(skb.enemyBank||0)*Math.PI/180,sn=Math.sin(a),cs=Math.cos(a),pt=(lx,ly)=>[x+(lx*cs-ly*sn)*s,y+(lx*sn+ly*cs)*s];
    poly([pt(-3,-2),pt(0,-15),pt(3,-2)],"#e6463c");poly([pt(-11,-3),pt(11,-3),pt(11,0),pt(-11,0)],"#e6463c");
    poly([pt(-3.5,-4),pt(3.5,-4),pt(3.5,9),pt(-3.5,9)],"#e6463c");poly([pt(-3,2),pt(-24,10),pt(-13,5)],"#e6463c");poly([pt(3,2),pt(24,10),pt(13,5)],"#e6463c");
    const e0=pt(-2.2,9),e1=pt(2.2,9);circle(e0[0],e0[1],Math.max(1,2.2*s),"#ff963c");circle(e1[0],e1[1],Math.max(1,2.2*s),"#ff963c");
  }

  // Source smoke draw: particles shrink over 1300ms and fade toward horizon-sky color after 55%.
  skbSmoke=skbSmoke.filter(q=>now-q.at<1300);
  for(const q of skbSmoke){
    const t=(now-q.at)/1300,rmin=2*(q.r0/6.5),r=Math.max(1,q.r0-(q.r0-rmin)*t),
      u=clamp((t-.55)/.45,0,1),col=mixAny("#ebebeb","#bedceb",u*.86);
    circle(q.x,q.y,r,col);
  }

  if(skb.missile){
    const m=skb.missile,vl=Math.max(1,Math.hypot(m.vx,m.vy)),dx=m.vx/vl,dy=m.vy/vl,
      hx=m.x+dx*5,hy2=m.y+dy*5,tx=m.x-dx*5,ty=m.y-dy*5;
    line(tx,ty,hx,hy2,1,"#fff");circle(hx,hy2,2,"#fff");circle(tx,ty,2,"#ffa028");
  }

  if(now-skb.explodeAt<560){let el=now-skb.explodeAt,p=el/560,r=el<110?3+p*22:el<260?22+(el-110)/150*10:32-(el-260)/300*30,c=el<110?"#ffff00":el<260?"#ff5a14":"#fff";circle(skb.enemyX,skb.enemyY,Math.max(1,r),c)}

  const locked=skb.state===2||skb.state===3,col=locked?"#ff3c3c":"#50ff8c",ax=skb.aimX,ay=skb.aimY,o=locked?16:13,inn=locked?7:6;
  line(ax-o,ay,ax-inn,ay,1,col);line(ax+inn,ay,ax+o,ay,1,col);line(ax,ay-o,ax,ay-inn,1,col);line(ax,ay+inn,ax,ay+o,1,col);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=S;ctx.strokeRect((ax-4)*S,(ay-4)*S,8*S,8*S);ctx.restore();
  if(skb.state===2&&(Math.floor(now/150)%2===0))txt("LOCK",ax,ay-o-14,9,"#ff3c3c","center",true);
  txt(`SCORE:${String(skb.kills*200).padStart(6,"0")}`,4,56,5,"#50ff8c");
  txt(`ENEMY:${String(Math.max(0,8-skb.kills%8)).padStart(2,"0")} HIT:${String(skb.kills%100).padStart(2,"0")}`,4,64,5,"#50ff8c");
  txt(`SPD:${String(700+Math.round(Math.sin(now*.0009)*90)).padStart(4,"0")}`,4,144,5,"#50ff8c");
  txt(`ALT:${String(5200+Math.round(Math.sin(now*.00042)*650)).padStart(5,"0")}`,246,144,5,"#50ff8c");
  txt("GUN:INF",248,174,5,"#50ff8c");txt("MSL:04",248,183,5,"#50ff8c");txt("SAAM:10",248,192,5,"#50ff8c");txt("DMG:00%",248,201,5,"#50ff8c");
}
function drawJet(x,y,s,c){poly([[x,y-12*s],[x-8*s,y+9*s],[x,y+5*s],[x+8*s,y+9*s]],c);line(x-15*s,y+5*s,x+15*s,y+5*s,3*s,c)}
function drawLighting(now,dt){
  switch(lightDisplay){
    case 0:return;case 1:return disco(now);case 2:return laser(now);case 3:return aurora(now);case 4:return matrix(now);
    case 5:return retroRace(now);case 6:return skyRaid(now);case 7:updateEyeSlotReels(now);return drawEyeSlotReels(now);case 8:return classicRace(now);
    case 9:return asteroids(now);case 10:return tunnel(now);case 11:return pacman(now);case 12:return fighter(now);case 13:return runner(now);
    case 14:return missile(now);case 15:return psyche(now);case 16:return vortex(now);case 17:return aquarium(now,dt);case 18:return flying(now);
    case 19:return washer(now);case 20:return invasion(now);case 21:return flower(now);case 22:return pinball(now,dt);case 23:return baseballMode(now);
    case 24:return skyburner(now);
  }
}

function pinballForeground(now){
  if(lightDisplay!==22)return;
  if(!pin2.eyeFlash)pin2.eyeFlash=[0,0];
  for(let i=0;i<2;i++){
    const ex=i===0?90:230;
    if(now-pin2.eyeFlash[i]<220){
      circle(ex,90,32,"#fff");
    }else{
      circle(ex,90,29,"#fff");
      circle(ex,90,26,"#ff8cbe");
      circle(ex,90,21,"#fff");
      txt("100",ex,93,9,"#000","center",true);
    }
  }
  // Always overwrite the normal black KariPom nose after the face layer.
  ellipse(160,145,18,12,"#ff8c14");
}

function foreground(now){if(lightDisplay===21)flowerHands(now);if(lightDisplay===22)pinballForeground(now)}

function updateRandom(now){
  if(vizManual===VIS.length && (!vizRandomLast||now-vizRandomLast>=RANDOM_MS)){vizDisplay=pickAvoid(VIS.length,vizRandomPick);vizRandomPick=vizDisplay;vizRandomLast=now}
  if(lightManual===LIGHT.length && (!lightRandomLast||now-lightRandomLast>=RANDOM_MS)){lightDisplay=pickAvoid(LIGHT.length,lightRandomPick);lightRandomPick=lightDisplay;lightRandomLast=now;resetModeClock()}
}
function refreshButtons(){
  document.querySelector("#character .value").textContent=CHARACTER[charMode];
  document.querySelector("#visualizer .value").textContent=vizManual===VIS.length?"Random":VIS[vizManual];
  document.querySelector("#lighting .value").textContent=lightManual===LIGHT.length?"Random":LIGHT[lightManual];
}
function cycle(kind,dir){
  if(kind==="character"){charMode=(charMode+(dir>0?1:-1)+CHARACTER.length)%CHARACTER.length}
  if(kind==="visualizer"){vizManual=(vizManual+(dir>0?1:-1)+(VIS.length+1))%(VIS.length+1);if(vizManual===VIS.length)vizRandomLast=0;else vizDisplay=vizManual}
  if(kind==="lighting"){lightManual=(lightManual+(dir>0?1:-1)+(LIGHT.length+1))%(LIGHT.length+1);if(lightManual===LIGHT.length)lightRandomLast=0;else{lightDisplay=lightManual;resetModeClock()}}
  refreshButtons();
}
function bindThird(id,kind){
  const el=document.getElementById(id);el.addEventListener("click",e=>{let r=el.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width/3)cycle(kind,-1);else if(x>=r.width*2/3)cycle(kind,1)})
}
bindThird("character","character");bindThird("visualizer","visualizer");bindThird("lighting","lighting");

async function startCapture(){
  try{
    if(!navigator.mediaDevices?.getDisplayMedia)throw new Error("このブラウザではタブ音声共有を利用できません。");
    let controller=null,options={video:true,audio:true};
    if("CaptureController" in window){try{controller=new CaptureController();options.controller=controller}catch(_){}}
    const s=await navigator.mediaDevices.getDisplayMedia(options);
    if(!s.getAudioTracks().length){s.getTracks().forEach(t=>t.stop());throw new Error("音声トラックがありません。「タブの音声も共有する」をONにしてください。")}
    if(controller?.setFocusBehavior){try{controller.setFocusBehavior("no-focus-change")}catch(_){}}
    stopCapture(false);stream=s;audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();
    analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=.10;analyser.minDecibels=-100;analyser.maxDecibels=-10;
    timeData=new Float32Array(analyser.fftSize);freqData=new Float32Array(analyser.frequencyBinCount);source=audioCtx.createMediaStreamSource(stream);source.connect(analyser);
    stream.getTracks().forEach(t=>t.addEventListener("ended",()=>stopCapture(true)));
    overlay.style.display="none";statusEl.textContent="";
  }catch(e){statusEl.textContent=`開始できません：${e.message}`}
}
function stopCapture(show=true){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(source){try{source.disconnect()}catch(_){}source=null}if(audioCtx){try{audioCtx.close()}catch(_){}audioCtx=null}
  analyser=null;speaking=false;wasSpeaking=false;mouthOpen=false;fft.fill(0);fftSmooth.fill(0);if(show){overlay.style.display="flex";statusEl.textContent="共有が停止しました。"}
}
document.getElementById("startBtn").addEventListener("click",startCapture);

function frame(now){
  let dt=clamp(now-lastFrame,0,50);lastFrame=now;updateAudio(now);updateFace(now);updateViz(now,dt);updateRandom(now);
  clear("#fff");
  ctx.save();ctx.beginPath();ctx.rect(0,TOP*S,cv.width,(240-TOP)*S);ctx.clip();drawLighting(now,dt);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(0,TOP*S,cv.width,(240-TOP)*S);ctx.clip();drawVisualizer(now);ctx.restore();
  foreground(now);requestAnimationFrame(frame)
}
refreshButtons();requestAnimationFrame(frame);
})();
</script>
